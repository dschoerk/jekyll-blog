name: Deploy production

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://schoerkhuber.at
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key of schoerkhuber.at:222
          echo "[schoerkhuber.at]:222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIAkWlhQQ+3UmISCXKJbRJlb8TXeNzlnWaUF+urTQD5Z" > ~/.ssh/known_hosts

      # The key is restricted to the site directory by rrsync on the server, so the target path is relative to it
      - name: Deploy
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -p 222 -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            _site/ dominik@schoerkhuber.at:./
